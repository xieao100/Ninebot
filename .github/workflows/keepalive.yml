name: Keepalive
on:
  schedule:
    - cron: '0 0 10 * *' # UTC每月10号跑一次，安全余量
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep repo alive (API模式，无commit)
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          days_threshold: 45
          use_api: true  # 重点：API保活，不会生成空提交
